name: Build Samsung OneLedger Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Report Build Error
        if: failure()
        run: |
          echo "## ❌ Build Debug APK Failed" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          tail -n 120 build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Report Build Success
        if: success()
        run: |
          echo "## ✅ Build Debug APK Succeeded" >> $GITHUB_STEP_SUMMARY
          echo "Samsung One UI OneLedger APK was successfully compiled and packaged." >> $GITHUB_STEP_SUMMARY

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OneLedger-Samsung-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
