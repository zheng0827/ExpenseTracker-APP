name: Build Samsung OneLedger Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Report Build Diagnostics
        if: always()
        run: |
          python3 -c "
          import os
          if os.path.exists('build.log'):
              with open('build.log', 'r', encoding='utf-8', errors='ignore') as f:
                  lines = f.readlines()
              err_count = 0
              for line in lines:
                  stripped = line.strip()
                  if any(k in stripped for k in ['e: ', 'AAPT: ', 'FAILURE:', 'Caused by:', 'Compilation error', 'Unresolved reference']):
                      print(f'::error title=Gradle Error::{stripped}')
                      err_count += 1
                      if err_count >= 50:
                          break
              for line in lines[-35:]:
                  print(f'::notice title=Log Tail::{line.strip()}')
          "

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OneLedger-Samsung-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
